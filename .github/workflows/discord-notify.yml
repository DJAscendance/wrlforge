name: Discord Update Notify

# Posts a message to Discord when WRL Forge is updated on main.
# Requires a DISCORD_WEBHOOK_URL repository secret.

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          ACTOR="${{ github.actor }}"
          COMMIT_MESSAGE=$(printf '%s' "${{ github.event.head_commit.message }}" | head -n 1)
          URL="${{ github.event.compare }}"

          PAYLOAD=$(printf '{"embeds":[{"title":"🛠️ WRL Forge updated on %s","description":"**%s** pushed an update to `%s`.\\n\\n**Latest commit:** %s\\n\\n[View changes on GitHub](%s)","color":5793266}]}' \
            "$BRANCH" "$ACTOR" "$BRANCH" "$COMMIT_MESSAGE" "$URL")

          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" | grep -qE "^2" || { echo "Discord webhook failed"; exit 1; }
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
