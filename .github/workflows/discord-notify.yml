name: Discord Release Notify

# Posts a message to Discord when a WRL Forge release is published.
# Requires a DISCORD_WEBHOOK_URL repository secret.

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NAME="${{ github.event.release.name }}"
          URL="${{ github.event.release.html_url }}"
          PRERELEASE="${{ github.event.release.prerelease }}"

          if [ "$PRERELEASE" = "true" ]; then
            LABEL="🧪 New Pre-release"
          else
            LABEL="🚀 New Release"
          fi

          PAYLOAD=$(printf '{"embeds":[{"title":"%s: %s","description":"**%s**\\n\\n[View release on GitHub](%s)","color":5793266}]}' \
            "$LABEL" "$TAG" "$NAME" "$URL")

          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" | grep -qE "^2" || { echo "Discord webhook failed"; exit 1; }
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
