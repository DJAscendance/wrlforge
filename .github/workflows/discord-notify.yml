name: Discord Update Notify

# Posts a message to Discord when WRL Forge is updated on main.
# Requires a DISCORD_WEBHOOK_URL repository secret.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          COMMIT_MESSAGE=${HEAD_COMMIT_MESSAGE%%$'\n'*}

          PAYLOAD=$(jq -n \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit "$COMMIT_MESSAGE" \
            --arg url "$COMPARE_URL" \
            '{embeds:[{title:("🛠️ WRL Forge updated on " + $branch),description:("**" + $actor + "** pushed an update to `" + $branch + "`.\n\n**Latest commit:** " + $commit + "\n\n[View changes on GitHub](" + $url + ")"),color:5793266}]}')

          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" | grep -qE "^2" || { echo "Discord webhook failed"; exit 1; }
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
