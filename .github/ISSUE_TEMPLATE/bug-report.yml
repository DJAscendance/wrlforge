name: Bug report
description: Report a problem with WRL Forge (crashes, incorrect behavior, editor or preview issues).
title: "[Bug]: "
labels: [bug, needs-info]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you post — privacy & copyright warning

        **Do NOT upload private or copyrighted worlds, `.wrl` files, textures, or other assets publicly unless you have permission to share them.**

        GitHub issues are **public**. Anyone can read and download whatever you attach here. Only attach content you created yourself or are clearly allowed to redistribute. If a file is not shareable, describe the problem in words or create a small minimal file that reproduces it instead.

        WRL Forge is an independent community project. It is **not affiliated with, endorsed by, or officially connected to Cybertown** or its current/former operators.
  - type: input
    id: version
    attributes:
      label: WRL Forge version
      description: Shown in the About screen / title bar.
      value: 1.3.0-beta.3
    validations:
      required: true
  - type: dropdown
    id: download-type
    attributes:
      label: Download type
      description: Which build are you running?
      options:
        - Linux AppImage
        - Linux tar.gz
        - Windows Setup EXE
        - Windows MSI
        - Windows Portable EXE
        - Windows ZIP
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      description: WRL Forge is x64-only for this public beta.
      options:
        - x64
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Which lane were you using?
      options:
        - Mall Item
        - World Project
        - Not applicable / not sure
    validations:
      required: true
  - type: dropdown
    id: wrl-encoding
    attributes:
      label: Plain or gzip-compressed WRL?
      options:
        - Plain (uncompressed)
        - Gzip-compressed
        - Not sure
        - Not applicable
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, in order, that lead to the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag-and-drop images here. Do not include private or copyrighted content.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Paste any error messages or console output. Please use a code block.
      render: text
    validations:
      required: false
  - type: dropdown
    id: minimal-repro
    attributes:
      label: Does it reproduce with a minimal file?
      description: Have you tried reproducing with a small, shareable test file?
      options:
        - "Yes"
        - "No"
        - Not tried
    validations:
      required: false
  - type: checkboxes
    id: content-ack
    attributes:
      label: Content acknowledgement
      options:
        - label: I confirm that any file, screenshot, or asset I attach does NOT contain private or copyrighted content that I lack permission to share publicly.
          required: true
