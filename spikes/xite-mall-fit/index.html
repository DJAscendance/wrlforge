<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>WRL Forge — X_ITE Mall Fit Spike</title>
<script defer src="node_modules/x_ite/dist/x_ite.min.js"></script>
<script defer src="bbox-traversal.js"></script>
<script defer src="guides.js"></script>
<script defer src="fit-math.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #1b1b1e; color: #ddd; font-family: sans-serif; }
  #canvas { width: 100%; height: 65vh; }
  #controls { padding: 0.5rem 1rem; }
  #report { padding: 0.5rem 1rem; white-space: pre-wrap; font-family: monospace; font-size: 0.8rem; }
  button { margin-right: 0.5rem; }
</style>
</head>
<body>
  <x3d-canvas id="canvas"></x3d-canvas>
  <div id="controls">
    <button id="modeOriginal">Original</button>
    <button id="modeFit">Cybertown Fit (preview only, not written to file)</button>
  </div>
  <div id="report">loading…</div>
  <script>
    // Fixture is inlined at load time (no filesystem IPC surface exists in
    // this spike at all -- see NOTES.md "Security boundary"). Nothing here
    // ever writes back to the loaded fixture -- there is no save/apply path.
    const params = new URLSearchParams(location.search);
    const fixtureName = params.get('fixture') || 'simple-box.wrl';

    let browser, fixtureText, fit, guideScene;

    async function loadOriginal() {
      const scene = await browser.createX3DFromString(fixtureText);
      await browser.replaceWorld(scene);
      return scene;
    }

    // "Cybertown Fit" mode: displays the original geometry PLUS the
    // non-exported guide layer (ground/center/Z-limit/10m cage) from
    // guides.js. This is a preview overlay only -- the proposed offset/scale
    // from fit-math.js is reported in the panel below, never applied to the
    // loaded geometry or written anywhere.
    async function loadFitPreview(rules) {
      const guidesVrml = window.buildGuidesVrml(rules);
      const combined = fixtureText + '\n' + guidesVrml.replace(/^#VRML V2\.0 utf8\n/, '');
      const scene = await browser.createX3DFromString(combined);
      await browser.replaceWorld(scene);
      return scene;
    }

    async function main() {
      await X3D();
      const canvas = document.getElementById('canvas');
      browser = canvas.browser;

      const res = await fetch('fixtures/' + fixtureName);
      fixtureText = await res.text();

      const originalScene = await loadOriginal();

      let result;
      try {
        const bbox = window.computeSceneBBox(originalScene);
        fit = bbox ? window.computeFit(bbox) : null;
        result = { fixture: fixtureName, bbox, fit, error: null };
      } catch (err) {
        result = { fixture: fixtureName, bbox: null, fit: null, error: String(err && err.stack || err) };
      }

      document.getElementById('report').textContent = JSON.stringify(result, null, 2);
      console.log('XITE_SPIKE_RESULT ' + JSON.stringify(result));

      document.getElementById('modeOriginal').addEventListener('click', loadOriginal);
      document.getElementById('modeFit').addEventListener('click', () => {
        if (fit) loadFitPreview(fit.rules);
      });

      // Non-interactive verification hook: prove the guide-layer VRML text
      // actually parses in X_ITE, not just that buildGuidesVrml() produces a
      // string. See NOTES.md "Preview behavior verification".
      if (params.get('verifyGuides') === '1' && fit) {
        try {
          await loadFitPreview(fit.rules);
          console.log('XITE_GUIDES_RESULT ' + JSON.stringify({ ok: true, error: null }));
        } catch (err) {
          console.log('XITE_GUIDES_RESULT ' + JSON.stringify({ ok: false, error: String(err && err.stack || err) }));
        }
      }
    }

    // x_ite.min.js, bbox-traversal.js, guides.js, and fit-math.js are loaded
    // with `defer`, which guarantees they've executed by the time
    // DOMContentLoaded fires (this inline script runs immediately during
    // parsing, before that -- calling main() directly here would race them).
    document.addEventListener('DOMContentLoaded', () => {
      main().catch((err) => {
        const msg = 'XITE_SPIKE_RESULT ' + JSON.stringify({ fixture: fixtureName, bbox: null, fit: null, error: String(err && err.stack || err) });
        document.getElementById('report').textContent = msg;
        console.log(msg);
      });
    });
  </script>
</body>
</html>
